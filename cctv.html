<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV Review Station</title>
<link rel="stylesheet" href="stylesheets/cctv.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div><b>GARDA CCTV REVIEW</b><small>Evidence Viewing Terminal</small></div>
    <div class="case">CASE 24918452 · READ ONLY</div>
  </header>

  <nav class="toolbar">
    <button id="playBtn" type="button">▶ Play</button>
    <button id="pauseBtn" type="button">Ⅱ Pause</button>
    <button id="rewindBtn" type="button">↶ Rewind</button>
    <span class="divider"></span>

    <label>
      Camera
      <select id="cameraSelect">
        <option value="0">CAM 1</option>
        <option value="1">CAM 2</option>
        <option value="2">CAM 3</option>
        <option value="3">CAM 4</option>
      </select>
    </label>

    <span class="readonly">VIEWING ONLY</span>
  </nav>

  <section class="workspace">
    <aside class="camera-list" id="cameraList"></aside>

    <section class="viewer">
      <div class="screen" id="screen">
        <video id="video" controls playsinline preload="metadata"></video>

        <div class="fallback" id="fallback">
          <div class="noise"></div>
          <div class="scene">
            <span class="road"></span>
            <span class="building"></span>
            <span class="vehicle"></span>
          </div>
        </div>

        <div class="overlay top">
          <span id="cameraLabel">CAM 1</span>
          <span></span>
        </div>

        <div class="paused" id="paused">PAUSED</div>
      </div>

      <div class="timeline">
        <span id="currentTime">00:00:00</span>
        <input id="scrubber" type="range" min="0" max="1000" value="0">
        <span id="durationTime">00:00:00</span>
      </div>
    </section>
  </section>

  <footer>
    <span id="status">Archive ready</span>
    <span>GDA-WS-07</span>
    <span>INTERNAL · PROP SYSTEM</span>
  </footer>
</main>

<script src="javascrips/cctv.js"></script>
</body>
</html>
