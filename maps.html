<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OpenBrowse Maps</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font:13px Tahoma,Arial,sans-serif;background:#d7dde6;color:#111}

.browser{height:82px;background:#ece9d8;border-bottom:1px solid #888}
.titlebar{
  height:28px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;background:linear-gradient(#dfefff,#8eaed3);
  border-bottom:1px solid #5c7b9a;color:#16324a;font-weight:bold
}
.winbuttons{display:flex;gap:4px}
.winbtn{width:25px;height:20px;padding:0;border:1px solid #6f8497;background:linear-gradient(#fff,#cbd8e3)}
.topbar{height:24px;display:flex;align-items:center;gap:18px;padding:0 9px;border-bottom:1px solid #bbb}
.toolbar{height:30px;display:flex;align-items:center;gap:5px;padding:3px 7px;background:#f4f4f4}
.toolbtn{width:29px;height:23px;padding:0}
.addr{flex:1;height:23px;display:flex;align-items:center;padding:0 7px;border:1px solid #888;background:#fff;color:#333}

.map-search{
  height:54px;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:#f0f4f8;border-bottom:1px solid #aaa
}
.brand{font-size:19px;font-weight:bold;color:#244f79;white-space:nowrap}
.map-search form{display:flex;gap:6px;flex:1}
.map-search input{flex:1;min-width:0;padding:7px;border:1px solid #7f9db9}
.map-search button{padding:7px 16px}

.layout{height:calc(100vh - 136px);display:grid;grid-template-columns:320px 1fr}
.sidebar{overflow:auto;padding:12px;background:#f7f7f7;border-right:1px solid #aaa}
.sidebar h2{margin:0 0 8px;color:#234b72;font-size:16px}
.query-line{margin:0 0 12px;color:#555}
.result{padding:10px 4px;border-bottom:1px solid #d3d3d3;cursor:pointer}
.result:hover{background:#e8f0f8}
.result b{display:block;color:#003399;margin-bottom:3px}
.result p{margin:0;color:#444;line-height:1.35}

.map-shell{position:relative;overflow:hidden;background:#eaf0e4}
.map{
  position:absolute;inset:-15%;width:130%;height:130%;
  transform-origin:center;transition:transform .18s ease;
  background:
    linear-gradient(27deg,transparent 47%,rgba(155,190,145,.25) 48%,rgba(155,190,145,.25) 52%,transparent 53%),
    linear-gradient(117deg,transparent 47%,rgba(180,210,170,.25) 48%,rgba(180,210,170,.25) 52%,transparent 53%),
    #eef4e9
}
.road{position:absolute;background:#f2d69b;border:2px solid #c59a42;box-shadow:0 0 0 1px #fff8}
.road.a{width:120%;height:40px;left:-10%;top:44%;transform:rotate(-12deg)}
.road.b{width:38px;height:120%;left:58%;top:-10%;transform:rotate(4deg)}
.road.c{width:80%;height:24px;left:20%;top:68%;transform:rotate(8deg)}
.water{position:absolute;width:34%;height:45%;right:-5%;top:8%;background:#b9d8ed;border:1px solid #8fb5cd;transform:rotate(-8deg)}
.area{position:absolute;background:#d4e7cd;border:1px solid #b8cfb0}
.area.one{left:9%;top:10%;width:25%;height:24%}
.area.two{left:68%;top:54%;width:22%;height:28%}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#d91d1d;border:2px solid #fff;box-shadow:0 1px 6px #0008}
.label{position:absolute;padding:4px 7px;background:#ffffe5;border:1px solid #777;white-space:nowrap;font-size:12px}

.zoom-controls{
  position:absolute;right:16px;top:16px;z-index:5;width:44px;padding:5px;
  background:#fff;border:1px solid #888;text-align:center
}
.zoom-controls button{display:block;width:32px;height:30px;margin:0 auto 4px;font-size:18px}
.zoom-controls input{width:95px;transform:rotate(-90deg);margin:39px -31px}
.zoom-readout{
  position:absolute;right:16px;bottom:14px;z-index:5;padding:5px 8px;
  background:#ffffffe8;border:1px solid #888
}
.tabs{
  position:absolute;left:14px;top:14px;z-index:5;display:flex
}
.tabs button{padding:6px 12px;border:1px solid #888;background:#f5f5f5}
.tabs button.active{background:#dbe9f5;font-weight:bold}

@media(max-width:850px){
  .layout{grid-template-columns:250px 1fr}
  .brand{font-size:16px}
}
</style>

<style id="openbrowse-embedded-fix">
html, body {
    width: 100%;
    min-height: 100%;
}
body.openbrowse-embedded {
    margin: 0 !important;
    overflow-x: hidden !important;
}
body.openbrowse-embedded > .browser {
    width: 100% !important;
    margin: 0 !important;
    border-top: 0 !important;
    box-shadow: none !important;
}
body.openbrowse-embedded > .browser > .titlebar {
    display: none !important;
}
body.openbrowse-embedded > .browser > .topbar {
    margin-top: 0 !important;
    border-top: 0 !important;
}
body.openbrowse-embedded > .taskbar {
    display: none !important;
}
</style>


<style id="openbrowse-compact-spacing-fix">
/* Tighter 2011-style browser chrome */
.browser > .titlebar {
    min-height: 28px !important;
    height: 28px !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
}

.browser > .topbar {
    min-height: 25px !important;
    height: 25px !important;
    padding: 0 10px !important;
    gap: 14px !important;
    align-items: center !important;
    line-height: 25px !important;
}

.browser > .topbar .menu-item,
.browser > .topbar .menu-button,
.browser > .topbar > span {
    margin: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    line-height: 25px !important;
}

.browser > .toolbar {
    min-height: 36px !important;
    height: 36px !important;
    padding: 4px 8px !important;
    gap: 6px !important;
    align-items: center !important;
}

.browser > .toolbar .toolbtn {
    width: 34px !important;
    height: 28px !important;
    padding: 0 !important;
    margin: 0 !important;
}

.browser > .toolbar .addr {
    min-height: 28px !important;
    height: 28px !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    line-height: 28px !important;
}

/* Remove any stray inherited spacing at the top of embedded pages */
body.openbrowse-embedded > .browser {
    padding: 0 !important;
}
</style>

</head>
<body>

<div class="browser">
  <div class="titlebar">
    <span>🌐 OpenBrowse 6 - Maps</span>
    <span class="winbuttons">
      <button class="winbtn">−</button><button class="winbtn">▢</button><button class="winbtn">×</button>
    </span>
  </div>
  <div class="topbar">
    <span>File</span><span>Edit</span><span>View</span><span>Bookmarks</span><span>Tools</span><span>Help</span>
  </div>
  <div class="toolbar">
    <button class="toolbtn" onclick="history.back()">‹</button>
    <button class="toolbtn" onclick="history.forward()">›</button>
    <button class="toolbtn" onclick="location.reload()">↻</button>
    <div class="addr" id="addressBar">http://maps.openbrowse.irl/</div>
  </div>
</div>

<section class="map-search">
  <div class="brand">OpenBrowse Maps</div>
  <form id="mapForm" action="maps.html" method="get">
    <input id="searchInput" name="q" placeholder="Search for a place">
    <button type="submit">Search Maps</button>
  </form>
  <button onclick="location.href='internet.html'">Home</button>
</section>

<div class="layout">
  <aside class="sidebar">
    <h2 id="resultsTitle">Map Search</h2>
    <p class="query-line" id="queryLine">Enter a location above.</p>
    <div id="results"></div>
  </aside>

  <main class="map-shell" id="mapShell">
    <div class="tabs">
      <button class="active">Map</button>
      <button>Satellite</button>
      <button>Terrain</button>
    </div>

    <div class="map" id="map">
      <div class="water"></div>
      <div class="area one"></div>
      <div class="area two"></div>
      <div class="road a"></div>
      <div class="road b"></div>
      <div class="road c"></div>

      <div class="pin" id="mainPin" style="top:44%;left:49%"></div>
      <div class="label" id="mainLabel" style="top:47%;left:52%">Selected location</div>

      <div class="pin" style="top:62%;left:66%"></div>
      <div class="label" style="top:65%;left:69%">Service Station</div>
    </div>

    <div class="zoom-controls">
      <button id="zoomIn" type="button">+</button>
      <input id="zoomSlider" type="range" min="70" max="250" value="100">
      <button id="zoomOut" type="button">−</button>
    </div>

    <div class="zoom-readout" id="zoomReadout">Zoom: 100%</div>
  </main>
</div>

<script>
const params = new URLSearchParams(location.search);
const query = (params.get('q') || '').trim();
const input = document.getElementById('searchInput');
const title = document.getElementById('resultsTitle');
const line = document.getElementById('queryLine');
const results = document.getElementById('results');
const mainLabel = document.getElementById('mainLabel');
const addressBar = document.getElementById('addressBar');

input.value = query;
addressBar.textContent = query
  ? 'http://maps.openbrowse.irl/search?q=' + encodeURIComponent(query)
  : 'http://maps.openbrowse.irl/';

const locations = [
  ['Junction North','Main road junction and CCTV camera location.'],
  ['Service Station Forecourt','Fuel station with exterior surveillance cameras.'],
  ['Estate Entrance','Residential access road and nearby junction.'],
  ['Town Centre East','Public car park and shopping district.']
];

if(query){
  title.textContent = 'Search Results';
  line.textContent = 'Results for "' + query + '"';
  mainLabel.textContent = query;

  const exact = locations.findIndex(item =>
    item[0].toLowerCase().includes(query.toLowerCase()) ||
    query.toLowerCase().includes(item[0].toLowerCase())
  );

  const ordered = exact >= 0
    ? [locations[exact], ...locations.filter((_,i)=>i!==exact)]
    : [[query,'Selected map location.'], ...locations];

  ordered.forEach((item,index)=>{
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML = '<b>'+(index+1)+'. '+escapeHtml(item[0])+'</b><p>'+escapeHtml(item[1])+'</p>';
    div.onclick = () => {
      input.value = item[0];
      mainLabel.textContent = item[0];
      line.textContent = 'Selected: ' + item[0];
    };
    results.appendChild(div);
  });
}else{
  locations.forEach((item,index)=>{
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML = '<b>'+(index+1)+'. '+escapeHtml(item[0])+'</b><p>'+escapeHtml(item[1])+'</p>';
    div.onclick = ()=>location.href='maps.html?q='+encodeURIComponent(item[0]);
    results.appendChild(div);
  });
}

function escapeHtml(value){
  return value.replace(/[&<>"']/g, char => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[char]);
}

const map = document.getElementById('map');
const slider = document.getElementById('zoomSlider');
const readout = document.getElementById('zoomReadout');
let zoom = 1;

function applyZoom(){
  map.style.transform = 'scale(' + zoom + ')';
  slider.value = Math.round(zoom * 100);
  readout.textContent = 'Zoom: ' + Math.round(zoom * 100) + '%';
}

document.getElementById('zoomIn').onclick = ()=>{
  zoom = Math.min(2.5, zoom + .2);
  applyZoom();
};

document.getElementById('zoomOut').onclick = ()=>{
  zoom = Math.max(.7, zoom - .2);
  applyZoom();
};

slider.oninput = ()=>{
  zoom = Number(slider.value) / 100;
  applyZoom();
};

document.getElementById('mapShell').addEventListener('dblclick', ()=>{
  zoom = Math.min(2.5, zoom + .2);
  applyZoom();
});

document.getElementById('mapShell').addEventListener('wheel', event=>{
  event.preventDefault();
  zoom += event.deltaY < 0 ? .1 : -.1;
  zoom = Math.max(.7, Math.min(2.5, zoom));
  applyZoom();
},{passive:false});

applyZoom();
</script>

<script id="openbrowse-embedded-script">
(function () {
    var params = new URLSearchParams(window.location.search);
    if (window.self !== window.top || params.get("embedded") === "1") {
        document.body.classList.add("openbrowse-embedded");
    }
}());
</script>

</body>
</html>
