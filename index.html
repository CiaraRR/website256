<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f1720;
    font-family:Segoe UI, Arial, sans-serif;
    color:white;
}

.panel{
    width:420px;
    background:#1e2d3a;
    border-radius:12px;
    padding:32px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

h1{
    margin-top:0;
    text-align:center;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;
    border:1px solid #506273;
    border-radius:6px;
    background:#15222e;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#2d5d88;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#error{
    color:#ff7b7b;
    text-align:center;
    height:20px;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="panel">
    <h1>DIGITAL INTERFACE PROP HUB</h1>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Log in</button>

    <div id="error"></div>
</div>

<script>
function login() {
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;

    if (user === "Fox2026" && pass === "SecureAccess11") {
        sessionStorage.setItem("loggedIn", "true");
        window.location.href = "hub.html";
    } else {
        document.getElementById("error").textContent =
            "Invalid username or password.";
    }
}
</script>

</body>
</html>
